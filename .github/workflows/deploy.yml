name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # JOB 1: CI — Build & Test
  # ─────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── PHP ──────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, bcmath, pdo, pdo_mysql, xml, zip, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # ── Node / Vite ──────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ── Laravel env & tests ──────────────
      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

  # ─────────────────────────────────────────
  # JOB 2: CD — Deploy via SSH
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/mbg-system

            echo "⬇️  Pull latest code..."
            git pull origin main

            echo "📦 Install PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🎨 Install & build frontend..."
            npm ci
            npm run build

            echo "🗂️  Run migrations..."
            php artisan migrate --force

            echo "🔄 Clear & cache config..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "♻️  Restart queue worker..."
            php artisan queue:restart

            echo "✅ Deploy selesai!"
